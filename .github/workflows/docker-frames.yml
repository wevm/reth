name: Frame Docker image

on:
  push:
    branches: [jxom/frame-rpc-alignment]
  workflow_dispatch:

permissions: {}

concurrency:
  group: frame-docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'wevm/reth'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: image
        run: |
          branch=$(printf '%s' "$GITHUB_REF_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9_.-]/-/g')
          echo "branch=ghcr.io/wevm/reth:${branch}" >> "$GITHUB_OUTPUT"
          echo "commit=ghcr.io/wevm/reth:sha-${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"
      - name: Build and publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          build-args: BUILD_PROFILE=release
          tags: |
            ${{ steps.image.outputs.branch }}
            ${{ steps.image.outputs.commit }}
          cache-from: type=gha,scope=frame-docker
          cache-to: type=gha,scope=frame-docker,mode=max
      - name: Verify published image
        env:
          IMAGE: ${{ steps.image.outputs.branch }}
        run: |
          docker buildx imagetools inspect "$IMAGE"
          echo "Published \`$IMAGE\` for linux/amd64." >> "$GITHUB_STEP_SUMMARY"
